# for planning.

REASONING_MODEL:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat 
  api_key: sk-1bdd889cbd3e46a6a454cb4bb322cf60
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates

# Reporter model for deep research report generation
REPORTER_MODEL:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat 
  api_key: sk-1bdd889cbd3e46a6a454cb4bb322cf60
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates


# OTHER SETTINGS:
# Search engine configuration
SEARCH_ENGINE:
  engine: custom_search
  # Only include results from these domains (for Tavily)
  include_domains:
    - example.com
    - trusted-news.com
    - reliable-source.org
    - gov.cn
    - edu.cn
  # Exclude results from these domains (for Tavily)
  exclude_domains:
    - example.com

# Web crawler configuration
CRAWLER:
  # Crawler type: 'deep_research' or 'jina'
  # - deep_research: 使用内网部署的DeepResearchMdCrawler（推荐）
  # - jina: 使用外网Jina AI服务
  type: "deep_research"
  
  # Deep Research Crawler settings
  deep_research:
    # HTML提取并转换为MD的API地址（一次性完成提取+转换）
    extract_api_url: "http://localhost:7986/extract_md"
    # 请求超时时间（秒）
    timeout: 30

# ============================================================================
# 工具结果压缩配置 (Tool Result Compression)
# ============================================================================
# 自动压缩工具调用的返回结果，减少上下文长度，同时保留关键信息
# 只压缩 ToolMessage，不影响用户输入和 AI 分析
# 支持两种压缩模式：
#   - truncate: 截断模式，直接截断工具返回内容
#   - summarize: 大模型摘要模式，使用 LLM 将工具返回总结成一段文字

TOOL_RESULT_COMPRESSION:
  # 是否启用工具结果压缩
  enabled: true
  
  # 压缩模式：truncate（截断）或 summarize（大模型摘要）
  # truncate: 直接截断旧的工具返回内容
  # summarize: 使用大模型将工具返回总结成简洁摘要
  mode: summarize
  
  # 触发条件 - 当满足任一阈值时触发压缩（OR 逻辑）
  trigger:
    # 消息数触发：当消息历史达到 N 条时触发
    - type: messages
      value: 15
    # Token 数触发：当消息历史达到 N tokens 时触发
    - type: tokens
      value: 12000
  
  # 工具结果保留策略
  keep:
    # 保留最近 N 条工具消息的完整内容
    recent_tool_messages: 2
    # 每条工具消息保留的最大字符数（截断模式使用）
    max_content_per_tool: 1000
  
  # 压缩模型配置（摘要模式使用）
  model:
    # 使用的模型（null = 使用 BASIC_MODEL）
    name: null
    # 压缩提示词温度
    temperature: 0.3
  
  # 大模型摘要配置（仅 summarize 模式生效）
  summarize:
    # 摘要提示词模板，{content} 会被替换为工具返回内容
    prompt: |
      请将以下工具调用返回结果压缩成一段简洁的摘要，保留关键信息和数据，去除冗余内容。
      
      工具返回内容：
      {content}
      
      摘要：
    # 摘要最大长度（字符数），超过此长度会被截断
    max_summary_length: 500
    # 是否在摘要中保留原始工具名称
    keep_tool_name: true

# ============================================================================
# 搜索预算控制配置 (Search Budget Control)
# ============================================================================
# 控制研究节点的搜索工具调用次数和token消耗，防止上下文溢出
# 每个researcher节点启动时会自动重置预算计数器

SEARCH_BUDGET:
  # 最大搜索调用次数（软限制）
  # 不同报告类型可以有不同的限制：
  # - business_marketing: 5次（对公营销报告）
  # - industry_report: 3次（行业研报）
  # - academic: 5次（学术研究）
  search_budget_max_calls: 5
  
  # 最大token数量（预警阈值）
  # 当消息历史达到此token数时会发出警告
  search_budget_max_tokens: 10000
  
  # 硬token限制（强制停止）
  # 超过此限制后将强制停止搜索
  search_budget_hard_limit: 14000
  
  # Token估算比例（字符数/token）
  # 用于估算消息的token消耗，中文通常在2-3之间，英文在4左右
  # 默认值2.5适合纯中文场景，中英混合建议3.0，纯英文建议4.0
  search_budget_token_chars_ratio: 2.5

  # （可选）researcher 节点每步搜索工具调用预算
  # 未设置时 Configuration 默认 5；也可用环境变量 RESEARCHER_RECURSION_LIMIT 覆盖
  # researcher_recursion_limit: 5