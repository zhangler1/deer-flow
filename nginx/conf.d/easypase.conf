# ===========================================================
# EasyParse Markdown to Word 负载均衡
# 仅在 docker compose -f docker-compose.easypase.yml 时挂载
# ===========================================================

# EasyParse 服务上游定义
upstream deer-flow-easyparse {
    # 最少连接数负载均衡
    least_conn;
    server easyparse:5000 max_fails=3 fail_timeout=30s;
}

# 注意：location 块需要在主配置文件的 server 块中定义
# 这里只提供 upstream 定义，避免 server 块冲突
