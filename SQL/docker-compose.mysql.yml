# ==========================================
# MySQL 服务 Docker Compose 配置示例
# ==========================================
# 使用方法:
#   1. 将此配置合并到主 docker-compose.yml 中
#   2. 或单独启动: docker-compose -f docker-compose.mysql.yml up -d
# ==========================================

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: deer-flow-mysql
    # 环境变量配置
    environment:
      # Root 用户密码（必需）
      MYSQL_ROOT_PASSWORD: 7175723zl  # root用户密码（请务必修改为强密码）
      MYSQL_DATABASE: omservice  # 初始化时自动创建的数据库名称
      MYSQL_USER: omuser@tellmua100#obhfcgb03uat   # 初始化时创建的普通用户（用于应用连接）
      MYSQL_PASSWORD: OceanBase_123#  # 普通用户密码（请修改）
      # 时区设置
      TZ: Asia/Shanghai
    # 端口映射
    ports:
      - "3306:3306"

    # 数据卷挂载
    volumes:
      # 初始化脚本目录（容器首次启动时自动执行）
      - ./SQL/init-scripts:/docker-entrypoint-initdb.d:ro
      # 数据持久化（使用命名卷）
      - mysql-data:/var/lib/mysql
      # MySQL 日志目录
      - mysql-logs:/var/log/mysql
      # 自定义配置文件（可选）
      - ./SQL/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    # 启动命令参数
    command:
      # 字符集配置
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      
      # 认证插件
      - --default-authentication-plugin=mysql_native_password
      
      # 时区
      - --default-time-zone=+08:00
      
      # 日志配置
      - --slow-query-log=1
      - --slow-query-log-file=/var/log/mysql/slow-query.log
      - --long-query-time=2
      # 性能优化
      - --max-connections=200
      - --max-allowed-packet=64M
    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p7175723zl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 重启策略
    restart: unless-stopped
    # 网络配置
    networks:
      - deer-flow-network

  # phpMyAdmin 管理工具（可选）
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: deer-flow-phpmyadmin
    
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 7175723zl
      UPLOAD_LIMIT: 64M
    
    ports:
      - "8080:80"
    
    depends_on:
      mysql:
        condition: service_healthy
    
    restart: unless-stopped
    
    networks:
      - deer-flow-network

# 数据卷定义
volumes:
  # MySQL 数据持久化
  mysql-data:
    driver: local
  
  # MySQL 日志
  mysql-logs:
    driver: local

# 网络定义
networks:
  deer-flow-network:
    driver: bridge
