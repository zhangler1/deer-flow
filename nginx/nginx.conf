events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
log_format main '{\n'
    '\t"remote_addr": "$remote_addr",\n'
    '\t"time_local": "$time_local",\n'
    '\t"request": "$request",\n'
    '\t"status": "$status",\n'
    '\t"http_referer": "$http_referer",\n'
    '\t"http_x_forwarded_for": "$http_x_forwarded_for"\n'
'}\n';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # 基本配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 上游服务器配置
    upstream deer-flow-backend {
        server backend:8000;
    }

    upstream deer-flow-frontend {
        server frontend:3000;
    }

    # EasyParse 服务负载均衡配置
    upstream easyparse-backend {
        # 双实例负载均衡，NGINX 会自动进行健康检查和流量分发
        server easyparse-1:5000 max_fails=2 fail_timeout=20s;
        server easyparse-2:5000 max_fails=2 fail_timeout=20s backup;
        
        # 连接池配置
        keepalive 32;
        
        # 启用主动健康检查（Open Source NGINX 通过 proxy_next_upstream 实现）
        # 当遇到以下错误时，自动尝试下一个上游服务器
    }

    # 主服务器配置
    server {
        listen 80;
        server_name localhost;

        # 客户端最大请求体大小
        client_max_body_size 10M;

        # SSE 流式接口 - 需要更长的超时时间
        # 深度研究流程可能需要数分钟执行搜索和工具调用
        location /api/chat/stream {
            proxy_pass http://deer-flow-backend/api/chat/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 必须使用 HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 禁用缓冲，确保 SSE 事件即时推送
            proxy_buffering off;
            proxy_cache off;

            # SSE 长连接超时：15 分钟，与前端 STREAM_TIMEOUT_MS 一致
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 900s;
        }

        location /api/research/simple/stream {
            proxy_pass http://deer-flow-backend/api/research/simple/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 900s;
        }

        # API路由代理到后端（通用规则，放在 SSE 专用规则之后）
        location /api/ {
            proxy_pass http://deer-flow-backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # EasyParse Markdown to Word 服务（供后端内部调用，经 nginx 负载均衡分发）
        # 后端 EASYPARSE_SERVICE_URL=http://nginx → 拼接出 /markdown_to_word → 命中此路由
        # 必须放在 / 之前，更精确的规则优先匹配
        # 注意：前端调 /api/markdown/to_word → nginx(/api/) → 后端 → nginx(/markdown_to_word) → easyparse
        location /markdown_to_word {
            proxy_pass http://easyparse-backend/markdown_to_word;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置（Markdown转Word可能需要较长时间）
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            
            # 支持大文件上传
            client_max_body_size 50M;
            
            # 故障转移配置：当上游服务器不可用时自动切换到下一个
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # ==========================================================================
        # 子路径部署（/deep-research-deerflow/）相关配置
        # 外层网关会把 host/deep-research-deerflow/* 原样转给本 nginx；
        # 前端构建时 basePath=/deep-research-deerflow，所有 _next/、资源、路由、API
        # 请求均带此前缀。
        # ==========================================================================

        # 子路径下的 SSE 流接口（去前缀后转后端）
        location /deep-research-deerflow/api/chat/stream {
            rewrite ^/deep-research-deerflow/(.*)$ /$1 break;
            proxy_pass http://deer-flow-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 900s;
        }

        location /deep-research-deerflow/api/research/simple/stream {
            rewrite ^/deep-research-deerflow/(.*)$ /$1 break;
            proxy_pass http://deer-flow-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 900s;
        }

        # 子路径下的通用 API（去前缀后转后端）
        location /deep-research-deerflow/api/ {
            rewrite ^/deep-research-deerflow/(.*)$ /$1 break;
            proxy_pass http://deer-flow-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 子路径下的前端页面/静态资源（保留前缀原样透传给 Next.js，
        # 因为前端 basePath 已设为 /deep-research-deerflow，Next 本身就在这个前缀下响应）
        location /deep-research-deerflow/ {
            proxy_pass http://deer-flow-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 静态资源和前端路由
        location / {
            proxy_pass http://deer-flow-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

    }
}