services:
  # PostgreSQL - LangGraph Checkpoint 持久化存储
  postgres:
    image: postgres:16-alpine
    container_name: deer-flow-postgres
    environment:
      - POSTGRES_USER=deerflow
      - POSTGRES_PASSWORD=deerflow_password_2025
      - POSTGRES_DB=deerflow_checkpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - deer-flow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deerflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: deer-flow-backend:latest
    container_name: deer-flow-backend
    # Remove the ports section to not expose to host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ID=docker-${HOSTNAME}
    expose:
      - "8000"
    volumes:
      - ./conf.yaml:/app/conf.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./src:/app/src
      - ./tests:/app/tests

    restart: unless-stopped
    networks:
      - deer-flow-network
    tty: true
    stdin_open: true
    entrypoint: ["/app/.venv/bin/python" ,"server.py" ,"--host", "0.0.0.0" ,"--port", "8000"]

  frontend:
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile.dev.yml
    #   args:
    #     - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
    image: deer-flow-front:latest
    container_name: deer-flow-frontend
    expose:
      - "3000"
    
    #使用运行时候环境变量覆盖
    # environment:
      # - NEXT_PUBLIC_API_URL=value
    env_file:
      - .env  
    # 挂载环境变量
    volumes:
      - ./web/messages:/app/messages/
      - ./web/.env.local:/app/web/.env.local:ro
      - ./conf.yaml:/app/conf.yaml:ro
      - ./web/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network
  nginx:
    image: nginx:latest
    container_name: deer-flow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - postgres  # 依赖 PostgreSQL
      - frontend
      - backend
      - easyparse-1
      - easyparse-2
    restart: unless-stopped
    networks:
      - deer-flow-network
  easyparse-1:
    image: easyparse:latest
    container_name: easyparse-1
    environment:
      - PORT=5000
      - SERVER_WORKERS=${SERVER_WORKERS:-4}
      - MD_WORKER=${MD_WORKER:-4}
      - IMG_WORKER=${IMG_WORKER:-4}
      - IMAGE_UPLOAD_URL=${IMAGE_UPLOAD_URL:-}
      - IMAGE_OUTPUT_DIR=${IMAGE_OUTPUT_DIR:-/tmp/shared_all/assert}
      - ERROR_IMG_DIR=${ERROR_IMG_DIR:-/tmp/shared_all/error}
      - LOG_DIR=${LOG_DIR:-/tmp/shared_all/logs}
      - LIMIT_MAX_REQUESTS=${LIMIT_MAX_REQUESTS:-200}
      - TIMEOUT_GRACEFUL_SHUTDOWN=${TIMEOUT_GRACEFUL_SHUTDOWN:-30}
    volumes:
      - venv_data:/app/.venv
      - shared_tmp:/tmp/shared_all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 覆盖 Dockerfile 的 CMD，添加 limit-max-requests 参数
    command: >
      --port 5000
      --workers ${SERVER_WORKERS:-4}
      --limit-max-requests ${LIMIT_MAX_REQUESTS:-200}
      --timeout-graceful-shutdown ${TIMEOUT_GRACEFUL_SHUTDOWN:-30}
    networks:
      - deer-flow-network

  easyparse-2:
    image: easyparse:latest
    container_name: easyparse-2
    environment:
      - PORT=5000
      - SERVER_WORKERS=${SERVER_WORKERS:-4}
      - MD_WORKER=${MD_WORKER:-4}
      - IMG_WORKER=${IMG_WORKER:-4}
      - IMAGE_UPLOAD_URL=${IMAGE_UPLOAD_URL:-}
      - IMAGE_OUTPUT_DIR=${IMAGE_OUTPUT_DIR:-/tmp/shared_all/assert}
      - ERROR_IMG_DIR=${ERROR_IMG_DIR:-/tmp/shared_all/error}
      - LOG_DIR=${LOG_DIR:-/tmp/shared_all/logs}
      - LIMIT_MAX_REQUESTS=${LIMIT_MAX_REQUESTS:-200}
      - TIMEOUT_GRACEFUL_SHUTDOWN=${TIMEOUT_GRACEFUL_SHUTDOWN:-30}
    volumes:
      - venv_data:/app/.venv
      - shared_tmp:/tmp/shared_all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 覆盖 Dockerfile 的 CMD，添加 limit-max-requests 参数
    command: >
      --port 5000
      --workers ${SERVER_WORKERS:-4}
      --limit-max-requests ${LIMIT_MAX_REQUESTS:-200}
      --timeout-graceful-shutdown ${TIMEOUT_GRACEFUL_SHUTDOWN:-30}
    networks:
      - deer-flow-network



networks:
  deer-flow-network:
    driver: bridge
    name: deer-flow-network



volumes:
  venv_data:
  shared_tmp:
  postgres_data:  # PostgreSQL 数据持久化
