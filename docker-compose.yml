services:
  backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: deer-flow-backend:latest
    container_name: deer-flow-backend
    # Remove the ports section to not expose to host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ID=docker-${HOSTNAME}
    expose:
      - "8000"
    volumes:
      - ./conf.yaml:/app/conf.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./src:/app/src
      - ./tests:/app/tests

    restart: unless-stopped
    networks:
      - deer-flow-network
    tty: true
    stdin_open: true
    entrypoint: ["/app/.venv/bin/python" ,"server.py" ,"--host", "0.0.0.0" ,"--port", "8000"]

  frontend:
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile.dev.yml
    #   args:
    #     - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
    image: deer-flow-front:latest
    container_name: deer-flow-frontend
    expose:
      - "3000"
    
    #使用运行时候环境变量覆盖
    # environment:
      # - NEXT_PUBLIC_API_URL=value
    env_file:
      - .env  
    # 挂载环境变量
    volumes:
      - ./web/messages:/app/messages/
      - ./web/.env.local:/app/web/.env.local:ro
      - ./conf.yaml:/app/conf.yaml:ro
      - ./web/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network
  nginx:
    image: nginx:latest
    container_name: deer-flow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network
  easyparse:
    image: easyparse:latest
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - SERVER_WORKERS=${SERVER_WORKERS:-4}
      - MD_WORKER=${MD_WORKER:-4}
      - IMG_WORKER=${IMG_WORKER:-4}
      - IMAGE_UPLOAD_URL=${IMAGE_UPLOAD_URL:-}
      - IMAGE_OUTPUT_DIR=${IMAGE_OUTPUT_DIR:-/tmp/shared_all/assert}
      - ERROR_IMG_DIR=${ERROR_IMG_DIR:-/tmp/shared_all/error}
      - LOG_DIR=${LOG_DIR:-/tmp/shared_all/logs}
    volumes:
      - venv_data:/app/.venv
      - shared_tmp:/tmp/shared_all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://192.168.0.106:5000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s



networks:
  deer-flow-network:
    driver: bridge
    name: deer-flow-network



volumes:
  venv_data:
  shared_tmp:
