# ==============================================================================
# 内网 BOCOM ELLM 环境配置模板
# ==============================================================================
# 使用方式：
#   1. 将此文件复制或直接编辑后使用：
#        cp conf.internal.yaml.example conf.internal.yaml  # (若存在模板)
#   2. 启动服务前设置环境变量：
#        export LLM_NETWORK=internal
#      系统会自动加载本文件替代 conf.yaml。
#   3. 未设置 LLM_NETWORK 或设为 external 时，继续使用 conf.yaml（DeepSeek 等外网配置），
#      两套配置互不影响。
#
# 关键设计特点
# 文件级切换，不做跨文件合并 — 选中哪个文件就只加载那个文件的全部内容，两套配置完全独立互不干扰。
# 优雅降级 — 如果设置了 LLM_NETWORK=internal 但 conf.internal.yaml 文件不存在，会记录警告并回退到 conf.yaml。
# 配置缓存 — 加载后的配置通过 load_yaml_config() 缓存在内存中，避免重复读取。
# 统一结构 — 两个文件的 YAML 结构完全一致（COORDINATOR_MODEL、PLANNER_MODEL、SEARCH_BUDGET 等），代码无需区分来源。
# 配置优先级 — 最终生效的优先级为：环境变量 > RunnableConfig > YAML配置 > 默认值。
# ==============================================================================

COORDINATOR_MODEL:
  platform: ellm
  model: Qwen3-235B-A22B
  base_url: http://eaip-chn-slb-7006.bocomm.com/ELLM.ELLM-ADAPTER.V-1.0/v1
  api_key_url: http://eaip-ellm-1.bocomm.com/ELLM.ELLM-OMSERVICE.V-1.0/createSceneApiKey.do
