# [!NOTE]
# Read the `docs/configuration_guide.md` carefully, and update the
# configurations to match your specific settings and requirements.
# - Replace `api_key` with your own credentials.
# - Replace `base_url` and `model` name if you want to use a custom model.
# - Set `verify_ssl` to `false` if your LLM server uses self-signed certificates
# - A restart is required every time you change the `config.yaml` file.

BASIC_MODEL:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat 
  api_key: sk-1bdd889cbd3e46a6a454cb4bb322cf60
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates

# To use Google Ai Studio as your basic platform:
# BASIC_MODEL:
#   platform: "google_aistudio"
#   model: "gemini-2.5-flash"  # or "gemini-1.5-pro", "gemini-2.5-flash-exp", etc.
#   api_key: your_gemini_api_key  # Get from https://aistudio.google.com/app/apikey
#   max_retries: 3
 
# Reasoning model is optional.
# Uncomment the following settings if you want to use reasoning model
# for planning.

REASONING_MODEL:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat 
  api_key: sk-1bdd889cbd3e46a6a454cb4bb322cf60
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates

# Reporter model for deep research report generation
REPORTER_MODEL:
  base_url: http://53.192.28.254:8841/v1
  model: GLM-4.7-Flash
  api_key: xxxx
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates


# OTHER SETTINGS:
# Search engine configuration
SEARCH_ENGINE:
  engine: custom_search
  # Only include results from these domains (for Tavily)
  include_domains:
    - example.com
    - trusted-news.com
    - reliable-source.org
    - gov.cn
    - edu.cn
  # Exclude results from these domains (for Tavily)
  exclude_domains:
    - example.com

# Custom search engine configuration
CUSTOM_SEARCH:
  # Available repository configurations
  repositories:
    aggregation_search:
      name: "聚合搜索"
      description: "聚合多个数据源的搜索服务"
      repository: "aggregation-search"
      channel_id: "0"
    vector_search:
      name: "向量库"
      description: "基于向量相似度的搜索服务"
      repository: "euvd-searchByChannelId"
      channel_id: "0"
    dynamic_search:
      name: "交行知道"
      description: "交通银行内部知识库搜索"
      repository: "okic-dynamicSearch"
      channel_id: "0"
    online_search:
      name: "互联网检索"
      description: "互联网公开信息搜索服务"
      repository: "online-search"
      channel_id: "0"
  # Default repository to use
  default_repository: "aggregation_search"

# Web crawler configuration
CRAWLER:
  # Crawler type: 'deep_research' or 'jina'
  # - deep_research: 使用内网部署的DeepResearchMdCrawler（推荐）
  # - jina: 使用外网Jina AI服务
  type: "deep_research"
  
  # Deep Research Crawler settings
  deep_research:
    # HTML提取并转换为MD的API地址（一次性完成提取+转换）
    extract_api_url: "http://localhost:7986/extract_md"
    # 请求超时时间（秒）
    timeout: 30

# ============================================================================
# Summarization Configuration (上下文压缩配置)
# ============================================================================
# Automatically summarize conversation history when token limits are approached
# This helps maintain context in long conversations without exceeding model limits

SUMMARIZATION:
  # 是否启用自动摘要压缩
  enabled: true

  # 摘要使用的模型（null = 使用默认的 BASIC_MODEL）
  # 建议使用轻量级模型以节省成本
  model_name: null

  # 触发条件 - 当满足任一阈值时触发摘要（OR 逻辑）
  # 可以配置单个或多个触发条件
  trigger:
    # Token 数触发：当消息历史达到 15564 tokens 时触发
    - type: tokens
      value: 15564
    # 消息数触发：当消息历史达到 50 条时触发
    - type: messages
      value: 50
    # 百分比触发：当达到模型最大 token 的 80% 时触发
    # - type: fraction
    #   value: 0.8

  # 上下文保留策略 - 摘要后保留多少历史
  keep:
    # 保留最近 10 条消息
    type: messages
    value: 10
    # 或者保留指定 token 数
    # type: tokens
    # value: 3000
    # 或者保留模型容量的百分比
    # type: fraction
    # value: 0.3

  # 准备摘要时的最大 token 数（null = 不限制）
  trim_tokens_to_summarize: 15564

  # 自定义摘要提示词（null = 使用默认 LangChain 提示词）
  summary_prompt: null