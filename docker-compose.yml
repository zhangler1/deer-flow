services:
  backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: deer-flow-backend:latest
    container_name: deer-flow-backend
    # Remove the ports section to not expose to host
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./conf.yaml:/app/conf.yaml:ro
    restart: unless-stopped
    networks:
      - deer-flow-network

  frontend:
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile.dev.yml
    #   args:
    #     - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
    image: deer-flow-front:latest
    container_name: deer-flow-frontend
    ports:
      - "3000:3000"
    #使用运行时候环境变量覆盖
    # environment:
      # - NEXT_PUBLIC_API_URL=value
    env_file:
      - .env  
    # 挂载环境变量
    volumes:
      - ./web/.env.local:/app/web/.env.local:ro
      - ./conf.yaml:/app/conf.yaml:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network

networks:
  deer-flow-network:
    driver: bridge
