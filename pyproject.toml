[project]
name = "deer-flow"
version = "0.1.0"
description = "DeerFlow project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # "langchain-community>=0.3.19",  # removed: 对齐 2.0，搜索工具后续迁移
    # "langchain-experimental>=0.3.4",  # removed: 仅 python_repl 用到，暂注释
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.9",
    "readabilipy>=0.3.0",
    "python-dotenv>=1.0.1",
    "socksio>=1.0.0",
    "markdownify>=1.1.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sse-starlette>=3.3.4",
    "pandas>=2.2.3",
    "numpy>=2.2.3",
    "yfinance>=0.2.54",
    # "litellm>=1.63.11",  # removed: 对齐 2.0，改用原生 langchain-* SDK
    "json-repair>=0.7.0",
    "jinja2>=3.1.3",
    "inquirerpy>=0.3.4",
    "mcp>=1.27.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-deepseek>=0.1.3",
    "langchain-google-genai>=4.2.2",
    "tavily-python>=0.7.17",  # Tavily 搜索 SDK（对齐 2.0，替代 langchain-community 的 tavily 子模块）
    # "langgraph-checkpoint-mongodb>=0.1.4",  # removed: 对齐 2.0，不再使用 MongoDB checkpoint
    # "mongomock>=4.3.0",  # removed: 不再使用 MongoDB，mongomock 不再需要
    "langgraph-checkpoint-postgres>=3.0.5",
    # "langchain-milvus>=0.2.1",  # removed: 对齐 2.0，不再使用向量库
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.13.3",
    "requests[socks]>=2.32.5",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    # "mongomock>=4.3.0",  # removed: 不再使用 MongoDB，mongomock 不再需要
    "pyright>=1.1.406",
    "colorama>=0.4.6",
    "pip>=25.2",
    "anyio>=4.12.0",
    "pytest-asyncio>=1.3.0",
    "langgraph-cli[inmem]>=0.4.24",
    "langchain>=1.2.15",
    "langfuse>=2.0.0",
    "aiohttp>=3.8.4",
    # "langchain-community>=0.3.19",  # removed: Tavily 已迁移到 tavily-python（对齐 2.0）；其他搜索工具（DuckDuckGo/Brave/Arxiv/Wikipedia）可选安装
]

[project.optional-dependencies]
dev = [
    "ruff",
    "langgraph-cli[inmem]>=0.2.10",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "asyncpg-stubs>=0.30.2",
    # "mongomock>=4.3.0",  # removed: 不再使用 MongoDB，mongomock 不再需要
    "pytest-postgresql>=7.0.2",
]

[tool.uv]
required-version = ">=0.6.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.report]
fail_under = 25

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
extend-include = ["*.pyi"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
exclude = ['^/build/']

