# OTHER SETTINGS:
# Search engine configuration
SEARCH_ENGINE:
  engine: custom_search
  # Only include results from these domains (for Tavily)
  include_domains:
    - example.com
    - trusted-news.com
    - reliable-source.org
    - gov.cn
    - edu.cn
  # Exclude results from these domains (for Tavily)
  exclude_domains:
    - example.com

# Custom search engine configuration
CUSTOM_SEARCH:
  # Available repository configurations
  repositories:
    aggregation_search:
      name: "聚合搜索"
      description: "聚合多个数据源的搜索服务"
      repository: "aggregation-search"
      channel_id: "0"
    vector_search:
      name: "向量库"
      description: "基于向量相似度的搜索服务"
      repository: "euvd-searchByChannelId"
      channel_id: "0"
    dynamic_search:
      name: "交行知道"
      description: "交通银行内部知识库搜索"
      repository: "okic-dynamicSearch"
      channel_id: "0"
    online_search:
      name: "互联网检索"
      description: "互联网公开信息搜索服务"
      repository: "online-search"
      channel_id: "0"
  # Default repository to use
  default_repository: "aggregation_search"

# Web crawler configuration
CRAWLER:
  # Crawler type: 'deep_research' or 'jina'
  # - deep_research: 使用内网部署的DeepResearchMdCrawler（推荐）
  # - jina: 使用外网Jina AI服务
  type: "deep_research"
  
  # Deep Research Crawler settings
  deep_research:
    # HTML提取并转换为MD的API地址（一次性完成提取+转换）
    extract_api_url: "http://localhost:7986/extract_md"
    # 请求超时时间（秒）
    timeout: 30

# ============================================================================
# 工具结果压缩配置 (Tool Result Compression)
# ============================================================================
# 自动压缩工具调用的返回结果，减少上下文长度，同时保留关键信息
# 只压缩 ToolMessage，不影响用户输入和 AI 分析

TOOL_RESULT_COMPRESSION:
  # 是否启用工具结果压缩
  enabled: true
  
  # 触发条件 - 当满足任一阈值时触发压缩（OR 逻辑）
  trigger:
    # 消息数触发：当消息历史达到 N 条时触发
    - type: messages
      value: 15
    # Token 数触发：当消息历史达到 N tokens 时触发
    - type: tokens
      value: 12000
  
  # 工具结果保留策略
  keep:
    # 保留最近 N 条工具消息的完整内容
    recent_tool_messages: 2
    # 每条工具消息保留的最大字符数（旧的工具消息会被截断）
    max_content_per_tool: 1000
  
  # 压缩模型配置
  model:
    # 使用的模型（null = 使用 BASIC_MODEL）
    name: null
    # 压缩提示词温度
    temperature: 0.3