services:
  backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: deer-flow-backend:latest
    container_name: deer-flow-backend
    # Remove the ports section to not expose to host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ID=docker-${HOSTNAME}
    expose:
      - "8000"
    volumes:
      - ./conf.yaml:/app/conf.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./src:/app/src
      - ./tests:/app/tests

    restart: unless-stopped
    networks:
      - deer-flow-network
    tty: true
    stdin_open: true
    entrypoint: ["/app/.venv/bin/python" ,"server.py" ,"--host", "0.0.0.0" ,"--port", "8000"]

  frontend:
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile.dev.yml
    #   args:
    #     - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
    image: deer-flow-front:latest
    container_name: deer-flow-frontend
    expose:
      - "3000"
    
    #使用运行时候环境变量覆盖
    # environment:
      # - NEXT_PUBLIC_API_URL=value
    env_file:
      - .env  
    # 挂载环境变量
    volumes:
      - ./web/.env.local:/app/web/.env.local:ro
      - ./web/:/app/
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network
  nginx:
    image: nginx:latest
    container_name: deer-flow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network

  mysql:
    image: mysql:8.0.39
    container_name: deer-flow-mysql
    # 环境变量配置
    environment:
      # Root 用户密码（必需）
      MYSQL_ROOT_PASSWORD: 7175723zl  # root用户密码（请务必修改为强密码）
      MYSQL_DATABASE: omservice  # 初始化时自动创建的数据库名称
      MYSQL_USER: omuser@tellmua100#obhfcgb03uat   # 初始化时创建的普通用户（用于应用连接）
      MYSQL_PASSWORD: OceanBase_123#  # 普通用户密码（请修改）
      # 时区设置
      TZ: Asia/Shanghai
    # 端口映射
    ports:
      - "3306:3306"

    # 数据卷挂载
    volumes:
      # 初始化脚本目录（容器首次启动时自动执行）
      - ./SQL/init-scripts:/docker-entrypoint-initdb.d:ro
      # 数据持久化（使用命名卷）
      - mysql-data:/var/lib/mysql
      # MySQL 日志目录
      - mysql-logs:/var/log/mysql
      # 自定义配置文件（可选）
      - ./SQL/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    # 启动命令参数
    command:
      # 字符集配置
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      
      # 认证插件
      - --default-authentication-plugin=mysql_native_password
      
      # 时区
      - --default-time-zone=+08:00
      
      # 日志配置
      - --slow-query-log=1
      - --slow-query-log-file=/var/log/mysql/slow-query.log
      - --long-query-time=2
      # 性能优化
      - --max-connections=200
      - --max-allowed-packet=64M
    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 重启策略
    restart: unless-stopped
    # 网络配置
    networks:
      - deer-flow-network

  # phpMyAdmin 管理工具（可选）
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: deer-flow-phpmyadmin
    
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 7175723zl
      UPLOAD_LIMIT: 64M
    
    ports:
      - "8089:80"
    
    depends_on:
      mysql:
        condition: service_healthy
    
    restart: unless-stopped
    
    networks:
      - deer-flow-network
  postgres:
    image: postgres:15-alpine
    container_name: langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: changeme_langfuse_password  # 生产环境请修改此密码
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks:
      - deer-flow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse 数据库（LangFuse v3 必需）
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: changeme_clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    # 添加安全选项以解决 get_mempolicy 权限问题
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # 如果上面的配置还不够，可以取消下面两行的注释（不推荐生产环境）
    # cap_add:
    #   - SYS_NICE
    #   - NET_ADMIN
    #   - IPC_LOCK
    networks:
      - deer-flow-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LangFuse 主服务
  langfuse-server:
    image: langfuse/langfuse:2.74.0
    container_name: langfuse-server
    restart: unless-stopped
    ports:
      - "3001:3000"  # Web UI 端口，避免与 frontend 冲突
    environment:
      # ===== 数据库配置 =====
      DATABASE_URL: postgresql://langfuse:changeme_langfuse_password@postgres:5432/langfuse
      # ClickHouse 配置（避免参数重复警告）
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: changeme_clickhouse_password
      CLICKHOUSE_DATABASE: langfuse
      # 禁用 ClickHouse 集群模式（单机部署不需要 Zookeeper）
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      
      # ===== 应用配置 =====
      # 访问地址（根据实际情况修改，如内网 IP）
      NEXTAUTH_URL: http://localhost:3001
      
      # Next.js 配置
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      
      # 安全密钥（生产环境必须修改为随机字符串）
      NEXTAUTH_SECRET: changeme-random-secret-key-min-32-chars-abcdef1234567890
      SALT: changeme-random-salt-min-32-chars-xyz9876543210
      
      # ===== 功能配置 =====
      # 禁用外网功能（适用于离线环境）
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      
      # 禁用遥测（不向 LangFuse 官方发送使用数据）
      TELEMETRY_ENABLED: "false"
      
      # 禁用更新检查（离线环境）
      NEXT_PUBLIC_DISABLE_UPDATE_CHECK: "true"
      
      # 日志级别（可选: debug, info, warn, error）
      LOG_LEVEL: info
      
      # ===== 可选配置 =====
      # 如需开启注册功能，设置为 true（默认为 false，只能管理员创建用户）
      # NEXTAUTH_ALLOW_SIGN_UP: "false"
      
      # 设置时区
      TZ: Asia/Shanghai
      
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - deer-flow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
# 数据卷定义
volumes:
  # MySQL 数据持久化
  mysql-data:
    driver: local
  langfuse-postgres-data:
    driver: local
  langfuse-clickhouse-data:
    driver: local
  # MySQL 日志
  mysql-logs:
    driver: local

networks:
  deer-flow-network:
    driver: bridge




