# [!NOTE]
# Read the `docs/configuration_guide.md` carefully, and update the
# configurations to match your specific settings and requirements.
# - Replace `api_key` with your own credentials.
# - Replace `base_url` and `model` name if you want to use a custom model.
# - Set `verify_ssl` to `false` if your LLM server uses self-signed certificates
# - A restart is required every time you change the `config.yaml` file.

BASIC_MODEL:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat 
  api_key: sk-1bdd889cbd3e46a6a454cb4bb322cf60
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates

# To use Google Ai Studio as your basic platform:
# BASIC_MODEL:
#   platform: "google_aistudio"
#   model: "gemini-2.5-flash"  # or "gemini-1.5-pro", "gemini-2.5-flash-exp", etc.
#   api_key: your_gemini_api_key  # Get from https://aistudio.google.com/app/apikey
#   max_retries: 3
 
# Reasoning model is optional.
# Uncomment the following settings if you want to use reasoning model
# for planning.

REASONING_MODEL:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat 
  api_key: sk-1bdd889cbd3e46a6a454cb4bb322cf60
  # max_retries: 3 # Maximum number of retries for LLM calls
  verify_ssl: false  # Uncomment this line to disable SSL certificate verification for self-signed certificates


# OTHER SETTINGS:
# Search engine configuration
SEARCH_ENGINE:
  engine: custom_search
  # Only include results from these domains (for Tavily)
  include_domains:
    - example.com
    - trusted-news.com
    - reliable-source.org
    - gov.cn
    - edu.cn
  # Exclude results from these domains (for Tavily)
  exclude_domains:
    - example.com

# Custom search engine configuration
CUSTOM_SEARCH:
  # Available repository configurations
  repositories:
    aggregation_search:
      name: "聚合搜索"
      description: "聚合多个数据源的搜索服务"
      repository: "aggregation-search"
      channel_id: "0"
    vector_search:
      name: "向量库"
      description: "基于向量相似度的搜索服务"
      repository: "euvd-searchByChannelId"
      channel_id: "0"
    dynamic_search:
      name: "交行知道"
      description: "交通银行内部知识库搜索"
      repository: "okic-dynamicSearch"
      channel_id: "0"
  # Default repository to use
  default_repository: "aggregation_search"