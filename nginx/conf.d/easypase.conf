# ===========================================================
# EasyParse Markdown to Word 负载均衡
# 仅在 docker compose -f docker-compose.easypase.yml 时挂载
# ===========================================================
upstream deer-flow-easypase {
    # 最少连接数负载均衡
    least_conn;
    server easyparse-1:5000 max_fails=3 fail_timeout=30s;
    server easyparse-2:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;

    # EasyParse Markdown to Word 路由
    # 调用链: 前端 /api/markdown/to_word → nginx(/api/) → 后端
    #        → 后端内部请求 nginx(/markdown_to_word) → easyparse 集群
    location /markdown_to_word {
        proxy_pass http://deer-flow-easypase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 文件上传限制
        client_max_body_size 20m;

        # 超时设置（Word 转换可能较慢）
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
