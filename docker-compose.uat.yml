services:
  # PostgreSQL - LangGraph Checkpoint 持久化存储
  postgres:
    image: postgres:16-alpine
    container_name: deer-flow-postgres
    environment:
      - POSTGRES_USER=deerflow
      - POSTGRES_PASSWORD=deerflow_password_2025
      - POSTGRES_DB=deerflow_checkpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - deer-flow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deerflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: deer-flow-backend.prd:latest
    container_name: deer-flow-backend
    # Remove the ports section to not expose to host
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ID=docker-${HOSTNAME}
    expose:
      - "8000"
    volumes:
      - ./conf.yaml:/app/conf.yaml:ro
      - ./conf.internal.yaml:/app/conf.internal.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml
      - ./src:/app/src
      - ./tests:/app/tests
      - ./skills:/app/skills

    restart: unless-stopped
    networks:
      - deer-flow-network
    tty: true
    stdin_open: true
    entrypoint: ["/app/.venv/bin/python" ,"server.py" ,"--host", "0.0.0.0" ,"--port", "8000"]

  frontend:
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile.dev.yml
    #   args:
    #     - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
    image: deer-flow-front.dev:latest
    container_name: deer-flow-frontend
    expose:
      - "3000"
    
    #使用运行时候环境变量覆盖
    # environment:
      # - NEXT_PUBLIC_API_URL=value
    env_file:
      - .env  
    # 挂载环境变量
    volumes:
      # ① 只挂会改的东西
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/messages:/app/messages
      - ./web/next.config.js:/app/next.config.js:ro
      - ./web/.env.local:/app/.env.local:ro   # 修正目标路径
      # ② 用匿名卷保护镜像内的 node_modules 和 .next
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network
  nginx:
    image: nginx:latest
    container_name: deer-flow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - postgres  # 依赖 PostgreSQL
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - deer-flow-network




  # MinIO - 对象存储服务（2025-04-22 版本，内置 Console）
  # minio:
  #   image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  #   container_name: deer-flow-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     - MINIO_ROOT_USER=deerflow
  #     - MINIO_ROOT_PASSWORD=deerflow_minio_2025
  #   ports:
  #     - "9000:9000"   # API 端口
  #     - "9001:9001"   # 控制台端口
  #   volumes:
  #     - minio_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - deer-flow-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

networks:
  deer-flow-network:
    driver: bridge
    name: deer-flow-network

volumes:
  venv_data:
  shared_tmp:
  postgres_data:  # PostgreSQL 数据持久化
  minio_data:     # MinIO 数据持久化
