events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 包含 conf.d 目录下的额外配置文件（如 easypase.conf）
    include       /etc/nginx/conf.d/*.conf;

    # 日志格式
log_format main '{\n'
    '\t"remote_addr": "$remote_addr",\n'
    '\t"time_local": "$time_local",\n'
    '\t"request": "$request",\n'
    '\t"status": "$status",\n'
    '\t"http_referer": "$http_referer",\n'
    '\t"http_x_forwarded_for": "$http_x_forwarded_for"\n'
'}\n';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # 基本配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 上游服务器配置已移至 conf.d/（upstreams.conf、minio.conf、easypase.conf）

    # 主服务器配置
    server {
        listen 80;
        server_name localhost;

        # 客户端最大请求体大小（文档上传最大20MB）
        client_max_body_size 20M;

        # ==========================================================================
        # 健康自检端点（供 scripts/health-monitor.sh 和外部运维探测使用）
        # - /health                          ：nginx 本身是否存活
        # - /deep-research-deerflow/health   ：子路径部署下的同等端点
        # 不写 access_log 避免日志污染
        # ==========================================================================
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /deep-research-deerflow/health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # SSE 流式接口 - 需要更长的超时时间
        # 深度研究流程可能需要数分钟执行搜索和工具调用
        # 正则合并：/api/chat/stream + /api/research/simple/stream
        # 注：正则 location 不能在 proxy_pass 后加路径，$uri 会自动原样透传
        location ~ ^/api/(chat/stream|research/simple/stream)$ {
            proxy_pass http://deer-flow-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 必须使用 HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 禁用缓冲，确保 SSE 事件即时推送
            proxy_buffering off;
            proxy_cache off;

            # SSE 长连接超时：1200s，须大于后端单步 AGENT_STEP_TIMEOUT (默认900s)，
            # 避免后端超时兑底事件还没推出去 nginx 先踢 504
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 1200s;
        }

        # API路由代理到后端（通用规则，放在 SSE 专用规则之后）
        location /api/ {
            proxy_pass http://deer-flow-backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # EasyParse Markdown to Word 服务（供后端内部调用，经 nginx 负载均衡分发）
        # 后端 EASYPARSE_SERVICE_URL=http://nginx → 拼接出 /markdown_to_word → 命中此路由
        # 必须放在 / 之前，更精确的规则优先匹配
        # 注意：前端调 /api/markdown/to_word → nginx(/api/) → 后端 → nginx(/markdown_to_word) → easyparse
        location /markdown_to_word {
            proxy_pass http://deer-flow-easyparse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 文件上传限制
            client_max_body_size 20m;

            # 超时设置（Word 转换可能较慢）
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # EasyParse 文档解析服务（供后端 /api/documents/upload 内部调用）
        # 后端 EASYPARSE_SERVICE_URL=http://nginx → 拼接出 /convert → 命中此路由
        location /convert {
            proxy_pass http://deer-flow-easyparse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 文档上传限制（最大50MB）
            client_max_body_size 55m;

            # 超时设置（文档解析可能较慢）
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }


        # ==========================================================================
        # 子路径部署（/deep-research-deerflow/）相关配置
        # 外层网关会把 host/deep-research-deerflow/* 原样转给本 nginx；
        # 前端构建时 basePath=/deep-research-deerflow，所有 _next/、资源、路由、API
        # 请求均带此前缀。
        # ==========================================================================

        # 子路径下的 SSE 流接口（正则合并两个 SSE，去前缀后转后端）
        location ~ ^/deep-research-deerflow/api/(chat/stream|research/simple/stream)$ {
            rewrite ^/deep-research-deerflow/(.*)$ /$1 break;
            proxy_pass http://deer-flow-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            # 子路径 SSE 长连接超时：与主路由保持一致 1200s，须 > 后端 AGENT_STEP_TIMEOUT
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 1200s;
        }

        # 子路径下的通用 API（去前缀后转后端）
        location /deep-research-deerflow/api/ {
            rewrite ^/deep-research-deerflow/(.*)$ /$1 break;
            proxy_pass http://deer-flow-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 子路径下的前端页面/静态资源（保留前缀原样透传给 Next.js，
        # 因为前端 basePath 已设为 /deep-research-deerflow，Next 本身就在这个前缀下响应）
        location /deep-research-deerflow/ {
            proxy_pass http://deer-flow-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }


        # MinIO S3 API 代理
        # location /minio/ {
        #     proxy_pass http://deer-flow-minio/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     # 文件上传限制（最大100MB）
        #     client_max_body_size 100m;

        #     # 超时设置
        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 120s;
        #     proxy_read_timeout 120s;
        # }

        # ==========================================================================
        # MinIO Console 控制台代理（子路径部署 /deep-research-deerflow/minio-console/）
        # 前提：minio 服务须设置环境变量
        #   MINIO_BROWSER_REDIRECT_URL=http(s)://<外部域名>/deep-research-deerflow/minio-console
        # 去掉子路径前缀后转发到 Console(9001)，Console 依据 REDIRECT_URL 生成带前缀的资源/API 链接。
        # 该 location 前缀比 /deep-research-deerflow/ 更长，nginx 按最长前缀优先命中，无需担心顺序。
        # http(s)://你的域名/deep-research-deerflow/minio-console/ 即可进控制台，账号 deerflow / 密码 deerflow_minio_2025。
        # ==========================================================================
        location /deep-research-deerflow/minio-console/ {
            rewrite ^/deep-research-deerflow/minio-console/(.*)$ /$1 break;
            proxy_pass http://deer-flow-minio-console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MinIO Console 需要 WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 关闭分块编码限制，避免大响应异常
            chunked_transfer_encoding off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态资源和前端路由
        location / {
            proxy_pass http://deer-flow-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

    }
}