# ==============================================================================
# 以下非 LLM 相关配置：保持与 conf.yaml 结构一致，可按内网实际情况覆盖。
# 若不在此文件声明，将不会被加载（本项目按文件级切换，不做跨文件合并）。
# 详细字段说明参见 conf.yaml。
# ==============================================================================




SEARCH_BUDGET:
  search_budget_max_calls: 5
  search_budget_max_tokens: 10000
  search_budget_hard_limit: 14000
  search_budget_token_chars_ratio: 2.5

# 搜索结果返回条数（精细化控制）
SEARCH_MAX_RESULTS:
  default: 10
  online_search: 10
  bocomsearch: 10
  searchknowledge_standard: 5
