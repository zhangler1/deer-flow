# ===========================================================
# docker-compose.easypase.yml  —  EasyParse 服务 override 文件
# ===========================================================
# 使用方式：
#   开发环境（不需要 EasyParse）：
#     docker compose up -d
#
#   需要 EasyParse 时：
#     docker compose -f docker-compose.yml -f docker-compose.easypase.yml up -d
#
#   同时叠加 Mock：
#     docker compose -f docker-compose.uat.yml -f docker-compose.local.yml -f docker-compose.easypase.yml up -d
# ===========================================================

services:
  easyparse-1:
    image: easyparse:latest
    container_name: deer-flow-easyparse-1
    volumes:
      - ../easyparse/routers:/app/routers
      - ../easyparse/md2word:/app/md2word
      - ../easyparse/utils:/app/utils
      - ../easyparse/server.py:/app/server.py:ro
      - ../easyparse/log_manager.py:/app/log_manager.py:ro
      - ../easyparse/config.py:/app/config.py:ro
    environment:
      - PORT=5000
      - SERVER_WORKERS=${SERVER_WORKERS:-4}
      - MD_WORKER=${MD_WORKER:-4}
      - IMG_WORKER=${IMG_WORKER:-4}
      - IMAGE_UPLOAD_URL=${IMAGE_UPLOAD_URL:-}
      - IMAGE_OUTPUT_DIR=${IMAGE_OUTPUT_DIR:-/tmp/shared_all/assert}
      - ERROR_IMG_DIR=${ERROR_IMG_DIR:-/tmp/shared_all/error}
      - LOG_DIR=${LOG_DIR:-/tmp/shared_all/logs}
      - LIMIT_MAX_REQUESTS=${LIMIT_MAX_REQUESTS:-200}
      - TIMEOUT_GRACEFUL_SHUTDOWN=${TIMEOUT_GRACEFUL_SHUTDOWN:-30}
    expose:
      - "5000"
    restart: unless-stopped
    networks:
      - deer-flow-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',5000));s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      --port 5000
      --workers ${SERVER_WORKERS:-4}
      --limit-max-requests ${LIMIT_MAX_REQUESTS:-200}
      --timeout-graceful-shutdown ${TIMEOUT_GRACEFUL_SHUTDOWN:-30}
  easyparse-2:
    image: easyparse:latest
    container_name: deer-flow-easyparse-2
    volumes:
      - ../easyparse/routers:/app/routers
      - ../easyparse/md2word:/app/md2word
      - ../easyparse/utils:/app/utils
      - ../easyparse/server.py:/app/server.py:ro
      - ../easyparse/log_manager.py:/app/log_manager.py:ro
      - ../easyparse/config.py:/app/config.py:ro
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "5000"
    restart: unless-stopped
    networks:
      - deer-flow-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',5000));s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      --port 5000
      --workers ${SERVER_WORKERS:-4}
      --limit-max-requests ${LIMIT_MAX_REQUESTS:-200}
      --timeout-graceful-shutdown ${TIMEOUT_GRACEFUL_SHUTDOWN:-30}

  # 覆盖 backend：注入 EasyParse 环境变量
  backend:
    environment:
      - EASYPARSE_SERVICE_URL=http://nginx
    depends_on:
      easyparse-1:
        condition: service_healthy
      easyparse-2:
        condition: service_healthy

  # 覆盖 nginx：挂载 EasyParse 的 upstream 和 location 配置
  nginx:
    volumes:
      - ./nginx/conf.d/easypase.conf:/etc/nginx/conf.d/easypase.conf:ro
    depends_on:
      easyparse-1:
        condition: service_healthy
      easyparse-2:
        condition: service_healthy
