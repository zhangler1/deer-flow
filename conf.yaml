# Web crawler configuration
CRAWLER:
  # Crawler type: 'deep_research' or 'jina'
  # - deep_research: 使用内网部署的DeepResearchMdCrawler（推荐）
  # - jina: 使用外网Jina AI服务
  type: "deep_research"
  
  # Deep Research Crawler settings
  deep_research:
    # HTML提取并转换为MD的API地址（一次性完成提取+转换）
    extract_api_url: "http://localhost:7986/extract_md"
    # 请求超时时间（秒）
    timeout: 30

# ============================================================================
# 工具结果压缩配置 (Tool Result Compression)
# ============================================================================
# 自动压缩工具调用的返回结果，减少上下文长度，同时保留关键信息
# 只压缩 ToolMessage，不影响用户输入和 AI 分析
# 支持两种压缩模式：
#   - truncate: 截断模式，直接截断工具返回内容
#   - summarize: 大模型摘要模式，使用 LLM 将工具返回总结成一段文字

TOOL_RESULT_COMPRESSION:
  # 是否启用工具结果压缩
  enabled: true
  
  # 压缩模式：truncate（截断）或 summarize（大模型摘要）
  # truncate: 直接截断旧的工具返回内容
  # summarize: 使用大模型将工具返回总结成简洁摘要
  mode: summarize
  
  # 触发条件 - 当满足任一阈值时触发压缩（OR 逻辑）
  trigger:
    # 消息数触发：当消息历史达到 N 条时触发
    - type: messages
      value: 15
    # Token 数触发：当消息历史达到 N tokens 时触发
    - type: tokens
      value: 12000
  
  # 工具结果保留策略
  keep:
    # 保留最近 N 条工具消息的完整内容
    recent_tool_messages: 2
    # 每条工具消息保留的最大字符数（截断模式使用）
    max_content_per_tool: 1000
  
  # 压缩模型配置（摘要模式使用）
  model:
    # 使用的模型（null = 使用 BASIC_MODEL）
    name: null
    # 压缩提示词温度
    temperature: 0.3
  
  # 大模型摘要配置（仅 summarize 模式生效）
  summarize:
    # 摘要提示词模板，{content} 会被替换为工具返回内容
    prompt: |
      请将以下工具调用返回结果压缩成一段简洁的摘要，保留关键信息和数据，去除冗余内容。
      
      工具返回内容：
      {content}
      
      摘要：
    # 摘要最大长度（字符数），超过此长度会被截断
    max_summary_length: 500
    # 是否在摘要中保留原始工具名称
    keep_tool_name: true

# ============================================================================
# 搜索预算控制配置 (Search Budget Control)
# ============================================================================
# 控制研究节点的搜索工具调用次数和token消耗，防止上下文溢出
# 每个researcher节点启动时会自动重置预算计数器

SEARCH_BUDGET:
  # 最大搜索调用次数（软限制）
  # 不同报告类型可以有不同的限制：
  # - business_marketing: 5次（对公营销报告）
  # - industry_report: 3次（行业研报）
  # - academic: 5次（学术研究）
  search_budget_max_calls: 5
  
  # 最大token数量（预警阈值）
  # 当消息历史达到此token数时会发出警告
  search_budget_max_tokens: 10000
  
  # 硬token限制（强制停止）
  # 超过此限制后将强制停止搜索
  search_budget_hard_limit: 14000
  
  # Token估算比例（字符数/token）
  # 用于估算消息的token消耗，中文通常在2-3之间，英文在4左右
  # 统一使用 3.0（中英混合场景），与 REACT_LOOP.summarization.token_chars_ratio 保持一致
  search_budget_token_chars_ratio: 3.0

  # （可选）researcher 节点每步搜索工具调用预算
  # 未设置时 Configuration 默认 5；也可用环境变量 RESEARCHER_RECURSION_LIMIT 覆盖
  # researcher_recursion_limit: 5

# ============================================================================
# 技能（Skill）系统配置
# ============================================================================
# Skill 系统允许通过 SKILL.md 文件声明式定义可扩展的 Agent 能力。
# public/ 下为内置 Skill，custom/ 下为用户/Agent 创建的自定义 Skill。
# 初始时 public/ 和 custom/ 目录为空，后续按需添加。

SKILLS:
  # Skill 目录的绝对路径（可选）
  # 未设置时默认为项目根目录下的 skills/ 目录
  # path: /home/user/deer-flow-1/skills

  # Skill 启用/禁用状态配置
  # 未在此处列出的 Skill 默认启用
  enabled_skills: {}
  # 示例：
  # enabled_skills:
  #   ppt-generation:
  #     enabled: false
  #   deep-research:
  #     enabled: true

# ============================================================================
# ReactLoop 中间件配置（对齐 DeerFlow 2.0 配置结构）
# ============================================================================
# 配置 ReactLoop 循环引擎及其中间件链。
# 所有中间件均有合理默认值，无需配置即可工作。
# 仅在需要调优时取消注释并修改。

REACT_LOOP:
  # 最大迭代次数（硬上限，达到后强制总结）
  max_iterations: 8

  # --- 循环检测中间件 ---
  loop_detection:
    # 哈希检测：相同 tool_calls 组合重复多少次触发强停
    hash_threshold: 3
    # 哈希历史窗口大小
    hash_window_size: 20
    # 软提示：第几轮开始注入停止警告（0=禁用）
    warn_at: 5
    # session 级频率检测：同一工具累计调用多少次警告
    freq_warn_threshold: 15
    # session 级频率检测：同一工具累计调用多少次强停
    freq_hard_threshold: 25

  # --- 上下文摘要中间件 ---
  summarization:
    enabled: true
    # 触发全局压缩的 token 阈值
    # 必须 < SEARCH_BUDGET.search_budget_hard_limit (14000)，让压缩先于预算硬限触发
    # 留出 2000 token 缓冲，允许压缩后继续研究
    max_context_tokens: 12000
    # 保留最近 N 条消息不压缩
    keep_recent_messages: 6
    # 单个工具结果最大字符数（即时截断）
    tool_result_max_chars: 3000
    # 压缩模式: summarize（LLM摘要）或 truncate（直接截断）
    compression_mode: summarize
    # 摘要最大长度（字符数）
    summary_max_chars: 1500
    # token 估算比率（字符数 / token）
    # 与 SEARCH_BUDGET.search_budget_token_chars_ratio 保持一致（中英混合 3.0）
    token_chars_ratio: 3.0

  # --- LLM 错误处理中间件 ---
  llm_error_handling:
    # 最大重试次数（不含首次）
    max_retries: 3
    # 基础延迟（秒）
    base_delay: 1.0
    # 最大延迟（秒）
    max_delay: 8.0
    # 退避倍数
    backoff_factor: 2.0
    # 熔断器：连续失败多少次后熔断
    circuit_breaker_threshold: 5
    # 熔断器：熔断后多少秒尝试恢复
    circuit_breaker_recovery_seconds: 30.0

  # --- 工具错误处理中间件 ---
  tool_error_handling:
    # 单个工具连续错误多少次后注入引导提示
    consecutive_error_warn: 3
    # 错误消息最大长度（截断过长的 traceback）
    error_max_chars: 500
    # 是否在错误消息中添加建议
    add_suggestions: true

  # --- Token 用量统计中间件 ---
  token_usage:
    enabled: true

  # --- 动态上下文注入中间件 ---
  dynamic_context:
    # 自定义系统提示（如角色说明），为空则只注入日期
    system_hint: ""

  # --- 预算执行中间件（方案 C：原生工具 + wrap_tool_call 拦截） ---
  # 仅对 researcher / iterative_researcher 生效
  # 控制 researcher 节点中原生搜索工具的调用预算。
  # bocomsearch 仍由 BudgetControlledSearchTool 包装器控制（guwp_token 需从 state 注入，线程安全）
  budget_enforcement:
    enabled: true
    # 每个 researcher 节点的最大搜索调用次数（与 SEARCH_BUDGET.search_budget_max_calls 保持一致）
    max_search_calls: 5
    # 软预警 token 阈值
    max_tokens: 10000
    # 硬 token 上限（达到后拒绝后续受控工具调用）
    hard_token_limit: 14000
    # 字符数/token 估算比例（中英混合 3.0，与 SEARCH_BUDGET、summarization 一致）
    token_chars_ratio: 3.0
    # 受预算控制的原生工具白名单
    controlled_tool_names:
      - online_search
      - searchknowledge_standard
      - financial_summary
      - product_instance_search
    # 是否在每次成功调用后给工具结果附加预算警告
    attach_warning: true

# ============================================================================
# Docx 页脚配置
# ============================================================================
# 控制 easyparse 生成的 docx 文件每页页脚声明文案
# 仅当 enabled=true 时，后端才会将 text 透传给 easyparse

DOCX_FOOTER:
  enabled: true
  text: "内容由AI生成，请核实重要信息"